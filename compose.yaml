services:
  portal:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      PORTAL_TRUST_PROXY: "1"
      PORTAL_OSS_BUCKET: "${PORTAL_OSS_BUCKET:-}"
      PORTAL_OSS_REGION: "${PORTAL_OSS_REGION:-}"
      PORTAL_OSS_INTERNAL: "${PORTAL_OSS_INTERNAL:-0}"
      OSS_ACCESS_KEY_ID: "${OSS_ACCESS_KEY_ID:-}"
      OSS_ACCESS_KEY_SECRET: "${OSS_ACCESS_KEY_SECRET:-}"
      OSS_SECURITY_TOKEN: "${OSS_SECURITY_TOKEN:-}"
    volumes:
      - portal_data:/data
    networks:
      - backend
      - oss_egress
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "2", "http://127.0.0.1:8765/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    environment:
      PORTAL_HOST: "${PORTAL_HOST:-${PORTAL_DOMAIN:-}}"
      PORTAL_HTTPS_PORT: "${PORTAL_HTTPS_PORT:-443}"
    depends_on:
      portal:
        condition: service_healthy
    ports:
      - "80:80"
      - "${PORTAL_HTTPS_PORT:-443}:${PORTAL_HTTPS_PORT:-443}"
    volumes:
      - ./deploy/${PORTAL_CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - backend
    restart: unless-stopped

networks:
  edge:
  oss_egress:
  backend:
    internal: true

volumes:
  portal_data:
  caddy_data:
  caddy_config:
