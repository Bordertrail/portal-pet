[package]
name = "portal-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
hmac = "0.12"
imagesize = "0.14"
portal-protocol = { path = "../protocol" }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
